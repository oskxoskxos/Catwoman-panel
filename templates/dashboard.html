<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>داشبورد | Xray Panel</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<div class="panel">

    <aside class="sidebar">

        <div class="brand">
            Xray Panel
        </div>

        <nav>

            <a href="/dashboard" class="active">
                🏠 داشبورد
            </a>

            <a href="/settings">
                ⚙️ تنظیمات
            </a>

            <a href="/logout">
                🚪 خروج
            </a>

        </nav>

    </aside>


    <main class="content">

        <div class="topbar">

            <h1>
                داشبورد
            </h1>

            <p>
                خوش آمدی {{ username }}
            </p>

        </div>


        <div class="cards">

            <div class="card">

                <span class="card-title">
                    وضعیت پنل
                </span>

                <strong class="online">
                    آنلاین
                </strong>

            </div>


            <div class="card">

                <span class="card-title">
                    وضعیت Xray
                </span>

                <strong class="online">
                    فعال
                </strong>

            </div>


            <div class="card">

                <span class="card-title">
                    کانفیگ‌ها
                </span>

                <strong>
                    1
                </strong>

            </div>

        </div>


        <div class="section">

            <h2>
                ساخت کانفیگ
            </h2>

            <p style="color:#858d9f;">
                کانفیگ VLESS را برای اتصال تولید کن.
            </p>

            <button
                onclick="generateConfig()"
                style="margin-top:15px;"
            >
                ساخت کانفیگ
            </button>


            <div
                id="configBox"
                style="display:none; margin-top:20px;"
            >

                <textarea
                    id="config"
                    readonly
                    style="
                        width:100%;
                        min-height:120px;
                        padding:15px;
                        border-radius:10px;
                        background:#10131a;
                        border:1px solid #303645;
                        color:white;
                        resize:vertical;
                        direction:ltr;
                    "
                ></textarea>


                <button
                    onclick="copyConfig()"
                    style="margin-top:12px;"
                >
                    کپی کانفیگ
                </button>

            </div>

        </div>


        <div class="section" style="margin-top:20px;">

            <h2>
                وضعیت سرویس
            </h2>

            <div class="status-box">

                <div class="status-dot"></div>

                <div>

                    <strong>
                        Xray فعال است
                    </strong>

                    <p>
                        WebSocket endpoint:
                        /xray-ws
                    </p>

                </div>

            </div>

        </div>

    </main>

</div>


<script>

async function generateConfig() {

    try {

        const response = await fetch("/generate-config");

        const data = await response.json();

        if (data.error) {

            alert(data.error);

            return;
        }

        document.getElementById("config").value =
            data.config;

        document.getElementById("configBox").style.display =
            "block";

    } catch (error) {

        alert("خطا در ساخت کانفیگ");

    }

}


function copyConfig() {

    const config =
        document.getElementById("config");

    config.select();

    config.setSelectionRange(
        0,
        99999
    );

    navigator.clipboard.writeText(
        config.value
    );

    alert("کانفیگ کپی شد");

}

</script>

</body>

</html>
